<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>TTS Test v2</title>
<style>body{font-family:sans-serif;padding:20px;}button{margin:6px;padding:8px 12px;font-size:14px;cursor:pointer;}.log{margin-top:20px;white-space:pre-wrap;font-family:monospace;background:#f5f5f5;padding:12px;font-size:12px;}</style>
</head><body>
<h2>TTS 跨域测试 v2（含CORS代理）</h2>

<h3>中文测试</h3>
<button onclick="testTTS('cors_baidu_zh','https://cors.sh/https://fanyi.baidu.com/gettts?lan=zh&text='+encodeURIComponent('你好世界')+'&spd=3&source=web')">CORS代理 百度中文</button>
<button onclick="testTTS('baidu_zh','https://fanyi.baidu.com/gettts?lan=zh&text='+encodeURIComponent('你好世界')+'&spd=3&source=web')">百度中文(直连)</button>
<button onclick="testTTS('youdao_zh','https://dict.youdao.com/dictvoice?audio='+encodeURIComponent('你好世界')+'&type=1')">有道中文</button>

<h3>英文测试</h3>
<button onclick="testTTS('youdao_en','https://dict.youdao.com/dictvoice?audio='+encodeURIComponent('hello world')+'&type=2&le=eng')">有道英文</button>
<button onclick="testTTS('baidu_en','https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent('hello world')+'&spd=3&source=web')">百度英文(直连)</button>

<h3>原生语音</h3>
<button onclick="testNative()">原生 speechSynthesis</button>

<div class="log" id="log">等待测试...</div>

<script>
function log(msg){
  var el=document.getElementById('log');
  el.textContent+=msg+'\n';
}

function testTTS(name,url){
  log('--- '+name+' ---');
  log('URL: '+url.substring(0,80)+'...');
  var a=document.createElement('audio');
  a.setAttribute('playsinline','');
  a.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;';
  a.src=url;
  document.body.appendChild(a);
  
  a.addEventListener('loadeddata',function(){log('['+name+'] loadeddata, duration='+a.duration);});
  a.addEventListener('canplay',function(){log('['+name+'] canplay, duration='+a.duration);});
  a.addEventListener('playing',function(){log('['+name+'] playing!');});
  a.addEventListener('ended',function(){log('['+name+'] ended');a.remove();});
  a.addEventListener('error',function(){log('['+name+'] ERROR: code='+a.error.code);a.remove();});
  a.addEventListener('stalled',function(){log('['+name+'] stalled');});
  
  a.play().then(function(){log('['+name+'] play() OK');}).catch(function(e){log('['+name+'] play() fail: '+e.message);a.remove();});
  
  setTimeout(function(){
    if(a.parentNode){
      log('['+name+'] 8秒超时: paused='+a.paused+', readyState='+a.readyState);
    }
  },8000);
}

function testNative(){
  log('--- 原生 speechSynthesis ---');
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){log('不可用');return;}
  var voices=speechSynthesis.getVoices();
  log('Voices: '+voices.length);
  var zh=voices.filter(function(v){return v.lang&&v.lang.indexOf('zh')===0;});
  log('中文: '+zh.map(function(v){return v.name+'('+v.lang+')';}).join(', ')||'无');
  var u=new SpeechSynthesisUtterance('你好世界');
  u.lang='zh-CN';u.rate=0.8;
  u.onstart=function(){log('原生: start');};
  u.onend=function(){log('原生: end');};
  u.onerror=function(e){log('原生: error '+e.error);};
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();};
}
</script>
</body></html>
