<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>TTS Test</title>
<style>body{font-family:sans-serif;padding:20px;}button{margin:8px;padding:8px 16px;font-size:16px;cursor:pointer;}.log{margin-top:20px;white-space:pre-wrap;font-family:monospace;background:#f5f5f5;padding:12px;}</style>
</head><body>
<h2>TTS 跨域播放测试</h2>
<p>点击按钮测试各TTS源</p>

<h3>中文测试</h3>
<button onclick="testTTS('baidu_zh','https://fanyi.baidu.com/gettts?lan=zh&text='+encodeURIComponent('你好世界')+'&spd=3&source=web')">百度翻译 中文</button>
<button onclick="testTTS('youdao_zh','https://dict.youdao.com/dictvoice?audio='+encodeURIComponent('你好世界')+'&type=1')">有道词典 中文</button>
<button onclick="testTTS('youdao_zh2','https://dict.youdao.com/dictvoice?audio='+encodeURIComponent('你好世界')+'&type=2')">有道词典 中文type=2</button>

<h3>英文测试</h3>
<button onclick="testTTS('baidu_en','https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent('hello world')+'&spd=3&source=web')">百度翻译 英文</button>
<button onclick="testTTS('youdao_en','https://dict.youdao.com/dictvoice?audio='+encodeURIComponent('hello world')+'&type=2&le=eng')">有道词典 英文</button>

<h3>原生语音</h3>
<button onclick="testNative()">原生 speechSynthesis 中文</button>

<div class="log" id="log">等待测试...</div>

<script>
function log(msg){
  var el=document.getElementById('log');
  el.textContent+=msg+'\n';
}

function testTTS(name,url){
  log('--- '+name+' ---');
  log('URL: '+url);
  var a=document.createElement('audio');
  a.setAttribute('playsinline','');
  a.setAttribute('webkit-playsinline','');
  a.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;';
  a.src=url;
  document.body.appendChild(a);
  
  a.addEventListener('loadstart',function(){log('['+name+'] loadstart');});
  a.addEventListener('loadeddata',function(){log('['+name+'] loadeddata, duration='+a.duration);});
  a.addEventListener('canplay',function(){log('['+name+'] canplay, duration='+a.duration);});
  a.addEventListener('playing',function(){log('['+name+'] playing!');});
  a.addEventListener('ended',function(){log('['+name+'] ended');a.remove();});
  a.addEventListener('error',function(){log('['+name+'] ERROR: code='+a.error.code+' src='+(a.src||'').substring(0,60));a.remove();});
  a.addEventListener('stalled',function(){log('['+name+'] stalled');});
  a.addEventListener('suspend',function(){log('['+name+'] suspend');});
  
  a.play().then(function(){log('['+name+'] play() resolved');}).catch(function(e){log('['+name+'] play() rejected: '+e.message);a.remove();});
  
  // Timeout check
  setTimeout(function(){
    if(a.parentNode){
      log('['+name+'] 5秒超时检查: paused='+a.paused+', readyState='+a.readyState+', duration='+a.duration);
    }
  },5000);
}

function testNative(){
  log('--- 原生 speechSynthesis ---');
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){
    log('原生TTS不可用');return;
  }
  var voices=speechSynthesis.getVoices();
  log('Voices数量: '+voices.length);
  var zhVoices=voices.filter(function(v){return v.lang&&v.lang.indexOf('zh')===0;});
  log('中文Voices: '+zhVoices.map(function(v){return v.name+'('+v.lang+')';}).join(', ')||'无');
  
  var u=new SpeechSynthesisUtterance('你好世界');
  u.lang='zh-CN';u.rate=0.8;
  u.onstart=function(){log('原生: 开始播放');};
  u.onend=function(){log('原生: 播放结束');};
  u.onerror=function(e){log('原生: 错误 '+e.error);};
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// Preload voices
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();};
}
</script>
</body></html>
